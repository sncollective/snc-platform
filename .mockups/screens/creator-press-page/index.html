<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator press page — compare four directions</title>
  <link rel="stylesheet" href="../../design-system/tokens.css">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font: var(--font-size-sm)/var(--line-height-normal) var(--font-ui); }
    header { min-height: 64px; padding: var(--space-md) var(--space-lg); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-sm); border-bottom: 1px solid var(--color-border); }
    h1 { margin: 0; font: var(--font-weight-normal) var(--font-size-xl-fluid)/1.2 var(--font-heading); }
    header p { margin: 0; color: var(--color-text-muted); }
    .grid { height: calc(100vh - 65px); padding: var(--space-sm); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: var(--space-sm); }
    .cell { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
    .cell h2 { margin: 0; min-height: 38px; padding: var(--space-sm) var(--space-md); display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); color: var(--color-text); font: var(--font-weight-semibold) var(--font-size-xs)/1.3 var(--font-ui); letter-spacing: var(--letter-spacing-wide); }
    .cell a { color: var(--color-accent); text-decoration: none; white-space: nowrap; }
    .cell a:hover { color: var(--color-accent-hover); }
    iframe { width: 100%; flex: 1; border: 0; background: var(--color-bg); }
    @media (max-width: 800px) {
      header { align-items: flex-start; flex-direction: column; }
      .grid { height: auto; grid-template-columns: 1fr; grid-template-rows: none; }
      .cell { height: 72vh; }
    }
  </style>
</head>
<body>
  <header><h1>Creator press page — pick a direction</h1><p>Animal Future · default EPK template · open any option full-size</p></header>
  <main class="grid">
    <section class="cell"><h2><span>Option 1 — Editorial / magazine</span><a href="option-1.html" target="_blank" rel="noopener">open ↗</a></h2><iframe src="option-1.html" title="Option 1 — Editorial magazine"></iframe></section>
    <section class="cell"><h2><span>Option 2 — Structured fact-sheet</span><a href="option-2.html" target="_blank" rel="noopener">open ↗</a></h2><iframe src="option-2.html" title="Option 2 — Structured fact-sheet"></iframe></section>
    <section class="cell"><h2><span>Option 3 — Minimal / quiet</span><a href="option-3.html" target="_blank" rel="noopener">open ↗</a></h2><iframe src="option-3.html" title="Option 3 — Minimal quiet"></iframe></section>
    <section class="cell"><h2><span>Option 4 — Image-led gallery</span><a href="option-4.html" target="_blank" rel="noopener">open ↗</a></h2><iframe src="option-4.html" title="Option 4 — Image-led gallery"></iframe></section>
  </main>
</body>
</html>
